name: platinum_world_management_system
description: "PWMS - Platinum World Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation & State Management
  go_router: ^14.8.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Persistence & Database
  drift: ^2.24.0
  drift_flutter: ^0.2.3
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Data Models & Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  intl: ^0.20.2

  # UI & Media
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  flutter_animate: ^4.5.2
  open_filex: ^4.7.0
  mobile_scanner: ^6.0.4
  http: ^1.2.2
  flutter_local_notifications: ^18.0.1
  share_plus: ^10.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.24.0
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - assets/
