name: Flutter Release (Android)

on:
  push:
    branches:
      - stable

permissions:
  contents: write
  actions: read

jobs:
  build-release:
    name: Build and Release APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - name: 🧭 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Inspect environment variables
        run: |
          echo "📏 Longitud de variables:"
          echo "KEYSTORE_BASE64: $(echo -n \"$KEYSTORE_BASE64\" | wc -c) bytes"
          echo "KEYSTORE_PASSWORD: $(echo -n \"$KEYSTORE_PASSWORD\" | wc -c) caracteres"
          echo "KEY_PASSWORD: $(echo -n \"$KEY_PASSWORD\" | wc -c) caracteres"
          echo "KEY_ALIAS: $(echo -n \"$KEY_ALIAS\" | wc -c) caracteres"

          if [ -z \"$KEYSTORE_BASE64\" ] || [ -z \"$KEYSTORE_PASSWORD\" ] || [ -z \"$KEY_PASSWORD\" ] || [ -z \"$KEY_ALIAS\" ]; then
            echo "❌ Alguna variable está vacía. Revisa los secretos configurados en el repositorio."
            exit 1
          fi

          if [ $(echo -n \"$KEYSTORE_BASE64\" | wc -c) -lt 1000 ]; then
            echo "⚠️ Advertencia: La variable KEYSTORE_BASE64 parece demasiado corta, puede estar incompleta."
          else
            echo "✅ Variables de entorno presentes y con tamaño adecuado."
          fi

      - name: 💾 Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # - name: 💾 Cache Gradle and Android SDK
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/.gradle/caches
      #       ~/.gradle/wrapper
      #       /usr/local/lib/android
      #     key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      #     restore-keys: |
      #       ${{ runner.os }}-gradle-

      - name: ⚙️ Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: "stable"

      - name: 🧰 Install dependencies
        run: flutter pub get

      - name: 🔐 Decode and configure keystore
        run: |
          mkdir -p android/app
          echo -n "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore
          storeType=pkcs12
          EOF

      - name: 🧪 Verify keystore size
        run: |
          ls -lh android/app/release-keystore
          if [ ! -s android/app/release-keystore ]; then
            echo "❌ El keystore está vacío o no se decodificó correctamente."
            exit 1
          fi

      - name: 🧪 Validate keystore integrity
        run: |
          keytool -list -keystore android/app/release-keystore -storetype pkcs12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: 🏗️ Build signed release APK
        run: flutter build apk --release --build-name=$(date +'%y.%m.%d')

      - name: 🧾 Get commit message
        id: commit
        run: |
          TAG="v$(date +'%y.%m.%d')"
          echo "🧾 Recolectando commits del día ${TAG#v}..."
          MSG=$(git log --pretty=format:"- %s" --since="$(date +'%Y-%m-%d 00:00:00')" --until="$(date +'%Y-%m-%d 23:59:59')" | tr -d '\r')
          if [ -z "$MSG" ]; then
            MSG=$(git log -1 --pretty=format:"- %s")
          fi
          {
            echo 'message<<EOF'
            echo "$MSG"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: 🏷️ Set release variables
        id: vars
        run: |
          TAG="v$(date +'%y.%m.%d')"
          VERSION="${TAG#v}"
          NAME="PWMS ${TAG}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: 📦 Prepare release files
        env:
          LATEST_VERSION: ${{ steps.vars.outputs.version }}
          CHANGELOG: ${{ steps.commit.outputs.message }}
          APK_URL: https://github.com/HakkinDavid/pwms/releases/latest/download/pwms-android-release.apk
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/pwms-android-release.apk

          jq -n \
            --arg latest_version "$LATEST_VERSION" \
            --arg changelog "$CHANGELOG" \
            --arg apk_url "$APK_URL" \
            '{
              latest_version: $latest_version,
              changelog: $changelog,
              apk_url: $apk_url
            }' > release/metadata.json

      - name: 🧾 Get commit message
        id: commit
        run: |
          TAG="v$(date +'%y.%m.%d')"
          echo "🧾 Recolectando commits del día ${TAG#v}..."
          MSG=$(git log --pretty=format:"- %s" --since="$(date +'%Y-%m-%d 00:00:00')" --until="$(date +'%Y-%m-%d 23:59:59')" | tr -d '\r')
          if [ -z "$MSG" ]; then
            MSG=$(git log -1 --pretty=format:"- %s")
          fi
          {
            echo 'message<<EOF'
            echo "$MSG"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: 🏷️ Calculate version
        id: vars
        run: |
          TAG="v$(date +'%y.%m.%d')"
          VERSION="${TAG#v}"
          NAME="PWMS ${TAG}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: 🚀 Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.name }}
          draft: false
          prerelease: false
          make_latest: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
